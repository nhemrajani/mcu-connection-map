<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The MCU Connection Map</title>
<style>
  :root {
    --bg: #07080c;
    --ink: #e9ecf5;
    --muted: #8a91a8;
    --line: rgba(150,170,255,.22);
    --panel: rgba(14,16,24,.86);
    --border: rgba(255,255,255,.10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Inter, sans-serif;
    overflow: hidden;
  }
  canvas { display: block; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .hud {
    position: fixed; top: 16px; left: 16px; z-index: 5;
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; max-width: 300px;
  }
  .hud h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .2px; }
  .hud p  { margin: 0; color: var(--muted); font-size: 12px; }
  .stats { margin-top: 10px; display: flex; gap: 14px; }
  .stat b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  .modes { display:flex; gap:0; margin-top:12px; border:1px solid var(--border); border-radius:7px; overflow:hidden; }
  .modes button {
    flex:1; padding:6px 8px; font:inherit; font-size:11.5px; cursor:pointer;
    background:transparent; color:var(--muted); border:0;
  }
  .modes button.on { background:rgba(217,164,65,.16); color:#e9d7a8; }
  .modes button:focus-visible { outline:2px solid #D9A441; outline-offset:-2px; }
  .legend { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
  .legend div { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); margin-bottom: 3px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

  .links { margin-top: 10px; display: flex; gap: 12px; }
  .links a {
    color: var(--muted); font-size: 11.5px; text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,.18); padding-bottom: 1px;
  }
  .links a:hover { color: var(--ink); border-bottom-color: #D9A441; }

  .tip {
    position: fixed; z-index: 6; pointer-events: none; opacity: 0;
    transition: opacity .12s; max-width: 320px;
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  }
  .tip.on { opacity: 1; }
  .tip h3 { margin: 0 0 3px; font-size: 13.5px; }
  .tip .film { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .tip .desc { font-size: 12px; color: #c3c9dc; }

  .help {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 11.5px; z-index: 5;
  }
</style>
</head>
<body>
<div class="hud">
  <h1>The MCU Connection Map</h1>
  <p id="blurb">Zoom in. Scenes blend where the model found a connection.</p>
  <div class="stats">
    <div class="stat"><b id="n-moments">–</b><span>moments</span></div>
    <div class="stat"><b id="n-edges">–</b><span>edges</span></div>
    <div class="stat"><b id="n-threads">–</b><span>threads</span></div>
  </div>
  <div class="modes">
    <button id="m-world" class="on">World</button><button id="m-threads">Threads</button><button id="m-meaning">Meaning</button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="links">
    <a href="https://github.com/nhemrajani/mcu-connection-map">source</a>
    <a href="https://github.com/nhemrajani/mcu-connection-map/blob/master/WHITEPAPER.md">white paper</a>
  </div>
</div>

<div class="tip" id="tip"></div>
<div class="help" id="help">drag to pan · scroll to zoom in and the world fills in</div>

<canvas id="sky"></canvas>

<script>
const cv = document.getElementById('sky');
const ctx = cv.getContext('2d');
const tip = document.getElementById('tip');

// Distinct hues for threads. Kept saturated but not neon, so dense regions
// still read as separate regions rather than a single glow.
const HUES = [200, 30, 330, 150, 265, 55, 0, 180, 300, 95, 20, 230];
const colour = (c, a = 1) => `hsla(${HUES[((c % HUES.length) + HUES.length) % HUES.length]}, 72%, 63%, ${a})`;

let nodes = [], edges = [], meta = {};
let scale = 1, ox = 0, oy = 0;          // viewport transform
let hover = null;

// "threads" uses the hybrid layout (connection pulls linked moments together);
// "meaning" uses the pure embedding projection, where position is only ever
// about what a moment means.
// "world" and "threads" both use the hybrid layout; they differ only in what
// is drawn on top of it. That matters: the imagery is only meaningful on a
// layout where connection pulls moments together, because adjacency is what
// makes two scenes blend into one another.
let mode = 'world';
const world = p => mode === 'meaning'
  ? ({ x: (p.sx ?? p.x) * 1.1, y: (p.sy ?? p.y) * 1.1 })
  : ({ x: p.x * 1.1, y: p.y * 1.1 });
const toScreen = p => ({ x: world(p).x * scale + ox, y: world(p).y * scale + oy });

// ---------------------------------------------------------------- imagery
//
// Each moment has a 512px scene with a soft radial alpha baked in (art/atlas.py).
// Drawn at their layout coordinates the scenes overlap, and overlapping soft
// edges cross-dissolve. That dissolve is the point: the layout only puts two
// moments next to each other when the graph connected them, so a blend between
// two scenes is a connection being drawn rather than a decorative effect.
//
// SCENE_W is measured against the layout rather than chosen by eye. Sampling
// the inhabited part of the map at a range of widths: at 34 units, 35% of it
// is empty black and the world is a scatter of vignettes. At 50 there are no
// gaps at all. Above that the extra width only buys more occlusion.
//
// It works out because ml/graph.py enforces a 16-unit minimum separation. The
// alpha is opaque to 55% of the half-width, so a 50-unit scene is solid out to
// 13.75 units: just inside that 16, which is the condition for every scene to
// keep its own centre while still reaching well into its neighbours. Change
// either number and the other has to move.
const SCENE_W = 50;

// Below this many pixels a scene is too small to read and 599 of them are just
// an expensive smudge, so the map stays a constellation and no images load at
// all. The crossfade between the two is the zoom gesture doing real work.
const SHOW_AT = 26, FULL_AT = 92, HIRES_AT = 210;
const MAX_INFLIGHT = 10;

const imgCache = new Map();
let inflight = 0, scenePos = null;

const smoothstep = t => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));

function fetchLevel(id, full, e) {
  // No queue: if the connection is busy the request is simply skipped and
  // retried on the next frame. Every completed load schedules a redraw, so
  // the retry always comes, and nothing can pile up a backlog of stale
  // requests for scenes the user has already panned away from.
  if (inflight >= MAX_INFLIGHT) return;
  const key = full ? 'loadingFull' : 'loadingThumb';
  if (e[key]) return;
  e[key] = true; inflight++;
  const im = new Image();
  im.onload = () => { e[full ? 'full' : 'thumb'] = im; inflight--; schedule(); };
  im.onerror = () => { inflight--; e[key] = 'failed'; };
  im.src = full ? `art/world/${id}.webp` : `art/world/thumb/${id}.webp`;
}

function sceneImage(id, wantFull) {
  let e = imgCache.get(id);
  if (!e) { e = { thumb: null, full: null }; imgCache.set(id, e); }
  if (!e.thumb) fetchLevel(id, false, e);
  if (wantFull && !e.full) fetchLevel(id, true, e);
  return e.full || e.thumb;
}

function drawWorld(px) {
  // px is the on-screen width of one scene, which decides both whether to draw
  // imagery at all and which resolution is worth fetching.
  const alpha = smoothstep((px - SHOW_AT) / (FULL_AT - SHOW_AT));
  if (alpha <= 0.01 || !scenePos) return 0;

  const wantFull = px >= HIRES_AT;
  const half = px / 2;
  ctx.globalAlpha = alpha;
  // scenePos is pre-sorted by ascending centrality, so the moments the graph
  // considers load-bearing are painted last and sit on top where scenes pile up.
  for (const s of scenePos) {
    const p = toScreen(s);
    if (p.x + half < 0 || p.y + half < 0 ||
        p.x - half > innerWidth || p.y - half > innerHeight) continue;
    const im = sceneImage(s.id, wantFull);
    if (im) ctx.drawImage(im, p.x - half, p.y - half, px, px);
  }
  ctx.globalAlpha = 1;
  return alpha;
}

let pending = false;
function schedule() {
  if (pending) return;
  pending = true;
  requestAnimationFrame(() => { pending = false; draw(); });
}

function radius(n) {
  // Centrality drives size, with a floor so unconnected moments stay visible.
  return 2.6 + (n.centrality || 0) * 42;
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr;
  cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px';
  cv.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function fit() {
  const xs = nodes.map(n => world(n).x), ys = nodes.map(n => world(n).y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 80;
  scale = Math.min((innerWidth - pad * 2) / (maxX - minX), (innerHeight - pad * 2) / (maxY - minY));
  ox = (innerWidth - (maxX + minX) * scale) / 2;
  oy = (innerHeight - (maxY + minY) * scale) / 2;
}

function draw() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  // The imagery goes down first and everything analytical is drawn over it,
  // fading back as it comes up. Both stay on screen through the middle of the
  // zoom on purpose: seeing the edge lines lie across the blends is what shows
  // that the blending is the graph and not an effect.
  const art = mode === 'world' ? drawWorld(SCENE_W * scale) : 0;
  const ink = 1 - art * 0.82;          // how much of the constellation survives

  // Edges first, underneath the stars. With a thousand of them a uniform
  // stroke is an unreadable hairball, so proposed edges stay very faint and
  // fade with length: short links describe local structure, long ones just
  // cross the map. Confirmed edges are drawn brighter and last.
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const ordered = [...edges].sort(a => (a.verdict === 'confirmed' ? 1 : -1));
  for (const e of ordered) {
    const a = byId[e.source], b = byId[e.target];
    if (!a || !b) continue;
    const p = toScreen(a), q = toScreen(b);
    const len = Math.hypot(p.x - q.x, p.y - q.y);
    const confirmed = e.verdict === 'confirmed';
    const fade = Math.max(0, 1 - len / (620 * Math.max(scale, .6)));
    const alpha = (confirmed ? .55 : 0.16 * fade) * (confirmed ? Math.max(ink, .45) : ink);
    if (alpha < 0.012) continue;
    ctx.lineWidth = confirmed ? 1.4 : Math.max(0.35, 0.7 * Math.min(scale, 1.8));
    ctx.strokeStyle = confirmed
      ? `rgba(255,236,190,${alpha})`
      : `${colour(a.community, alpha).replace('hsla', 'hsla')}`;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  }

  for (const n of nodes) {
    const p = toScreen(n);
    const r = radius(n) * Math.max(0.55, Math.min(scale, 2.4));
    if (p.x < -60 || p.y < -60 || p.x > innerWidth + 60 || p.y > innerHeight + 60) continue;

    const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 4.5);
    glow.addColorStop(0, colour(n.community, .40 * ink));
    glow.addColorStop(1, colour(n.community, 0));
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 4.5, 0, 7); ctx.fill();

    ctx.fillStyle = n === hover ? '#fff' : colour(n.community, .95 * Math.max(ink, .3));
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
  }

  // Labels appear once zoomed in, or the sky is unreadable. They then go away
  // again as the imagery comes up: six hundred titles printed over the artwork
  // is worse than none, and the tooltip already names whatever is under the
  // cursor. So the only label that survives into the world view is the hovered
  // one, which is the only one being asked for.
  ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,.9)';
  const label = (n, a) => {
    const p = toScreen(n);
    if (p.x < 0 || p.y < 0 || p.x > innerWidth || p.y > innerHeight) return;
    ctx.fillStyle = `rgba(233,236,245,${a})`;
    ctx.shadowBlur = 5;
    ctx.fillText(n.title, p.x, p.y - radius(n) * Math.min(scale, 2.4) - 7);
  };
  const legible = Math.min(1, (scale - 1.5) / 1.2) * .78 * (1 - art);
  if (scale > 1.5 && legible > 0.04) for (const n of nodes) label(n, legible);
  if (hover) label(hover, 1);
  ctx.shadowBlur = 0;
}

// An opening move, and the argument for it. The map fits to the whole corpus,
// and at that scale no imagery loads, so a visitor who never zooms sees a star
// chart and leaves believing that is what this is. The thesis of the project is
// that zooming in turns connection into picture, so the page performs it once:
// the constellation holds for a moment, then draws in and the world resolves.
// Any input at all cancels it, because it is a demonstration and not a ride.
let intro = null;

function densest() {
  // Aim at the busiest part of the map rather than its centroid, so the
  // opening move lands somewhere with enough neighbours to show a blend.
  let best = nodes[0], bestN = -1;
  for (const a of nodes) {
    let k = 0;
    for (const b of nodes)
      if ((a.x - b.x) ** 2 + (a.y - b.y) ** 2 < 70 * 70) k++;
    if (k > bestN) { bestN = k; best = a; }
  }
  return best;
}

function startIntro() {
  if (mode !== 'world' || !scenePos) return;
  const target = densest();
  const from = { scale, ox, oy }, to = 1.95;
  const w = world(target);
  const t0 = performance.now(), HOLD = 900, RUN = 2300;
  intro = requestAnimationFrame(function step(now) {
    const e = now - t0;
    if (e > HOLD) {
      const u = Math.min(1, (e - HOLD) / RUN);
      const k = u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2;   // ease in-out
      scale = from.scale + (to - from.scale) * k;
      ox = innerWidth / 2 - w.x * scale;
      oy = innerHeight / 2 - w.y * scale;
      draw();
      if (u >= 1) { intro = null; return; }
    }
    intro = requestAnimationFrame(step);
  });
}

function stopIntro() {
  if (intro !== null) { cancelAnimationFrame(intro); intro = null; }
}

function nearest(mx, my) {
  let best = null, bestD = 22 * 22;
  for (const n of nodes) {
    const p = toScreen(n);
    const d = (p.x - mx) ** 2 + (p.y - my) ** 2;
    if (d < bestD) { bestD = d; best = n; }
  }
  return best;
}

let dragging = false, lastX = 0, lastY = 0;
cv.addEventListener('mousedown', e => { stopIntro(); dragging = true; lastX = e.clientX; lastY = e.clientY; cv.classList.add('dragging'); });
addEventListener('mouseup', () => { dragging = false; cv.classList.remove('dragging'); });
cv.addEventListener('mousemove', e => {
  if (dragging) {
    ox += e.clientX - lastX; oy += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    tip.classList.remove('on');
    draw();
    return;
  }
  const n = nearest(e.clientX, e.clientY);
  if (n !== hover) { hover = n; draw(); }
  if (n) {
    tip.innerHTML = `<h3>${n.title}</h3><div class="film">${n.film}</div><div class="desc">${n.description}</div>`;
    tip.style.left = Math.min(e.clientX + 16, innerWidth - 340) + 'px';
    tip.style.top = Math.min(e.clientY + 16, innerHeight - 140) + 'px';
    tip.classList.add('on');
  } else tip.classList.remove('on');
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  stopIntro();
  const k = Math.exp(-e.deltaY * 0.0016);
  const nx = e.clientX - (e.clientX - ox) * k;
  const ny = e.clientY - (e.clientY - oy) * k;
  scale *= k; ox = nx; oy = ny;
  draw();
}, { passive: false });
addEventListener('resize', resize);

const BLURB = {
  world:   'Zoom in. Scenes blend where the model found a connection.',
  threads: 'Position is computed from meaning, then pulled by connection.',
  meaning: 'Position is the embedding alone. No connection pull.',
};
function setMode(next) {
  stopIntro();
  const relayout = (next === 'meaning') !== (mode === 'meaning');
  mode = next;
  for (const m of ['world', 'threads', 'meaning'])
    document.getElementById('m-' + m).classList.toggle('on', next === m);
  document.getElementById('blurb').textContent = BLURB[next];
  // Only the meaning view uses different coordinates, so switching between
  // world and threads must not throw away wherever the user has zoomed to.
  if (relayout) fit();
  draw();
}
for (const m of ['world', 'threads', 'meaning'])
  document.getElementById('m-' + m).onclick = () => setMode(m);

fetch('ml/out/graph.json')
  .then(r => r.json())
  .then(g => {
    nodes = g.nodes; edges = g.edges; meta = g.meta || {};
    const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
    document.getElementById('n-moments').textContent = meta.moments ?? nodes.length;
    document.getElementById('n-edges').textContent = (meta.confirmed_edges ?? 0) + (meta.proposed_edges ?? 0);
    document.getElementById('n-threads').textContent = meta.threads ?? '–';

    const counts = {};
    for (const n of nodes) counts[n.community] = (counts[n.community] || 0) + 1;
    const legend = document.getElementById('legend');
    legend.innerHTML = Object.entries(counts)
      .sort((a, b) => b[1] - a[1]).slice(0, 6)
      .map(([c, k]) => `<div><i class="dot" style="background:${colour(+c)}"></i> thread ${c} · ${k} moments</div>`)
      .join('') + `<div style="margin-top:6px;opacity:.75">${meta.thread_basis || ''}</div>`;

    fit(); resize();

    // The scene manifest is optional: without it the map still works as a
    // constellation, so a half-rendered or missing art/world/ degrades to the
    // previous behaviour rather than breaking the page.
    fetch('art/world/manifest.json')
      .then(r => (r.ok ? r.json() : Promise.reject(r.status)))
      .then(man => {
        const have = new Set(man.scenes.map(s => s.id));
        scenePos = [...man.scenes].sort((a, b) => a.order - b.order)
          .map(s => byId[s.id]).filter(Boolean);
        document.getElementById('help').textContent =
          `drag to pan · scroll to zoom · ${have.size} scenes`;
        draw();
        startIntro();
      })
      .catch(() => {
        document.getElementById('m-world').disabled = true;
        setMode('threads');
      });
  })
  .catch(err => {
    document.querySelector('.help').textContent = 'could not load ml/out/graph.json — run ml/embed.py then ml/graph.py';
    console.error(err);
  });
</script>
</body>
</html>
